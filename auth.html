<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>AutoParts Auth</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:
      linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7)),
      url('./img/car.jpg') center/cover no-repeat;
      overflow:hidden;
    }

    .auth-container{
      width:420px;
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(20px);
      border:1px solid rgba(255,255,255,0.15);
      padding:35px;
      border-radius:25px;
      color:white;
      box-shadow:0 10px 40px rgba(0,0,0,0.4);
      animation:fadeIn .5s ease;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .logo{
      text-align:center;
      margin-bottom:20px;
    }

    .logo h1{
      color:#ff6347;
      font-size:35px;
    }

    .logo p{
      font-size:14px;
      opacity:.8;
    }

    .tabs{
      display:flex;
      margin-bottom:25px;
      background:rgba(255,255,255,0.08);
      border-radius:12px;
      overflow:hidden;
    }

    .tab{
      flex:1;
      padding:12px;
      text-align:center;
      cursor:pointer;
      transition:.3s;
      font-weight:600;
    }

    .tab.active{
      background:#ff6347;
    }

    .form-group{
      margin-bottom:18px;
    }

    .form-group label{
      display:block;
      margin-bottom:7px;
      font-size:14px;
    }

    .form-group input{
      width:100%;
      padding:14px;
      border:none;
      outline:none;
      border-radius:12px;
      background:rgba(255,255,255,0.1);
      color:white;
      font-size:15px;
    }

    .form-group input::placeholder{
      color:rgba(255,255,255,0.7);
    }

    .password-wrapper{
      position:relative;
    }

    .toggle-password{
      position:absolute;
      right:15px;
      top:50%;
      transform:translateY(-50%);
      cursor:pointer;
      font-size:14px;
      color:#ccc;
    }

    .btn{
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      background:#ff6347;
      color:white;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
      transition:.3s;
      margin-top:10px;
    }

    .btn:hover{
      background:#ff4500;
      transform:translateY(-2px);
    }

    .google-btn{
      background:white;
      color:#333;
      margin-top:15px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
    }

    .google-btn img{
      width:20px;
    }

    .switch-text{
      margin-top:18px;
      text-align:center;
      font-size:14px;
    }

    .switch-text span{
      color:#ff6347;
      cursor:pointer;
      font-weight:600;
    }

    .message{
      margin-top:15px;
      font-size:14px;
      text-align:center;
      padding:10px;
      border-radius:10px;
      display:none;
    }

    .success{
      background:#1d4d2b;
      color:#8cffb0;
    }

    .error{
      background:#4d1d1d;
      color:#ff9c9c;
    }

    .password-rules{
      margin-top:10px;
      background:rgba(255,255,255,0.08);
      padding:12px;
      border-radius:12px;
      font-size:13px;
    }

    .rule{
      margin:5px 0;
      color:#ff8b8b;
      transition:.3s;
    }

    .rule.valid{
      color:#7dff9f;
    }

    .hidden{
      display:none;
    }

    @media(max-width:500px){

      .auth-container{
        width:92%;
        padding:25px;
      }

    }

  </style>
</head>

<body>

<div class="auth-container">

  <div class="logo">
    <h1>AutoParts</h1>
    <p>Premium Auto Parts Store</p>
  </div>

  <div class="tabs">
    <div class="tab active" id="loginTab">Login</div>
    <div class="tab" id="signupTab">Sign Up</div>
  </div>

  <!-- LOGIN FORM -->

  <form id="loginForm" autocomplete="off">

    <!-- Fake hidden fields to stop autofill -->
    <input type="text" style="display:none">
    <input type="password" style="display:none">

    <div class="form-group">
      <label>Email</label>

      <input 
      type="email"
      id="loginEmail"
      placeholder="Enter your email"
      required
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      name="fake-login-email">
    </div>

    <div class="form-group">
      <label>Password</label>

      <div class="password-wrapper">

        <input
        type="password"
        id="loginPassword"
        placeholder="Enter password"
        required
        autocomplete="new-password"
        name="fake-login-password">

        <span class="toggle-password" onclick="togglePassword('loginPassword')">👁</span>

      </div>

    </div>

    <button type="submit" class="btn">Login</button>

    <button type="button" class="btn google-btn" id="googleLogin">

      <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png">

      Continue with Google

    </button>

  </form>

  <!-- SIGNUP FORM -->

  <form id="signupForm" class="hidden" autocomplete="off">

    <!-- Fake hidden fields to stop autofill -->
    <input type="text" style="display:none">
    <input type="password" style="display:none">

    <div class="form-group">
      <label>Full Name</label>

      <input
      type="text"
      id="signupName"
      placeholder="Enter your full name"
      required
      autocomplete="off"
      name="fake-name">
    </div>

    <div class="form-group">
      <label>Email</label>

      <input
      type="email"
      id="signupEmail"
      placeholder="Enter your email"
      required
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      name="fake-signup-email">
    </div>

    <div class="form-group">

      <label>Password</label>

      <div class="password-wrapper">

        <input
        type="password"
        id="signupPassword"
        placeholder="Create password"
        required
        autocomplete="new-password"
        name="fake-signup-password">

        <span class="toggle-password" onclick="togglePassword('signupPassword')">👁</span>

      </div>

      <div class="password-rules">

        <div class="rule" id="lengthRule">❌ Minimum 8 characters</div>

        <div class="rule" id="upperRule">❌ One uppercase letter</div>

        <div class="rule" id="numberRule">❌ One number</div>

        <div class="rule" id="specialRule">❌ One special character</div>

      </div>

    </div>

    <button type="submit" class="btn">Create Account</button>

    <button type="button" class="btn google-btn" id="googleSignup">

      <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png">

      Sign Up with Google

    </button>

  </form>

  <div class="message" id="messageBox"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  sendEmailVerification,
  signInWithPopup,
  GoogleAuthProvider,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBBgKgDmd36zo0pRXRczMcBSzArK7OEJDo",
  authDomain: "autoparts-7f16a.firebaseapp.com",
  projectId: "autoparts-7f16a",
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();

const loginTab = document.getElementById("loginTab");
const signupTab = document.getElementById("signupTab");

const loginForm = document.getElementById("loginForm");
const signupForm = document.getElementById("signupForm");

const messageBox = document.getElementById("messageBox");

loginTab.addEventListener("click", () => {

  loginTab.classList.add("active");
  signupTab.classList.remove("active");

  loginForm.classList.remove("hidden");
  signupForm.classList.add("hidden");

});

signupTab.addEventListener("click", () => {

  signupTab.classList.add("active");
  loginTab.classList.remove("active");

  signupForm.classList.remove("hidden");
  loginForm.classList.add("hidden");

});

function showMessage(message,type){

  messageBox.style.display="block";
  messageBox.className=`message ${type}`;
  messageBox.innerText=message;

  setTimeout(()=>{
    messageBox.style.display="none";
  },4000);

}

window.togglePassword=function(id){

  const input=document.getElementById(id);

  if(input.type==="password"){
    input.type="text";
  }else{
    input.type="password";
  }

}

// PASSWORD VALIDATION

const passwordInput=document.getElementById("signupPassword");

passwordInput.addEventListener("input",()=>{

  const password=passwordInput.value;

  const length=/^.{8,}$/;
  const upper=/[A-Z]/;
  const number=/[0-9]/;
  const special=/[!@#$%^&*(),.?":{}|<>]/;

  validateRule("lengthRule",length.test(password));
  validateRule("upperRule",upper.test(password));
  validateRule("numberRule",number.test(password));
  validateRule("specialRule",special.test(password));

});

function validateRule(id,valid){

  const element=document.getElementById(id);

  if(valid){

    element.classList.add("valid");
    element.innerHTML="✅ "+element.innerText.substring(2);

  }else{

    element.classList.remove("valid");
    element.innerHTML="❌ "+element.innerText.substring(2);

  }

}

// SIGNUP

signupForm.addEventListener("submit",async(e)=>{

  e.preventDefault();

  const email=document.getElementById("signupEmail").value;

  const password=document.getElementById("signupPassword").value;

  const strongPassword =
    /^(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#$%^&*])/;

  if(password.length < 8 || !strongPassword.test(password)){

    showMessage(
      "Password must contain 8 characters, uppercase, number and special character.",
      "error"
    );

    return;

  }

  try{

    const userCredential=await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );

    await sendEmailVerification(userCredential.user);

    await signOut(auth);

    showMessage(
      "Verification email sent. Please verify before login.",
      "success"
    );

    signupForm.reset();

  }catch(error){

    showMessage(error.message,"error");

  }

});

// LOGIN

loginForm.addEventListener("submit",async(e)=>{

  e.preventDefault();

  const email=document.getElementById("loginEmail").value;

  const password=document.getElementById("loginPassword").value;

  try{

    const userCredential=await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    if(!userCredential.user.emailVerified){

      await signOut(auth);

      showMessage(
        "Please verify your email before login.",
        "error"
      );

      return;

    }

    showMessage("Login successful!","success");

    setTimeout(()=>{
      window.location.href="index.html";
    },1500);

  }catch(error){

    showMessage(error.message,"error");

  }

});

// GOOGLE LOGIN

document.getElementById("googleLogin")
.addEventListener("click",googleSignIn);

document.getElementById("googleSignup")
.addEventListener("click",googleSignIn);

async function googleSignIn(){

  try{

    await signInWithPopup(auth,provider);

    showMessage("Google Login Successful","success");

    setTimeout(()=>{
      window.location.href="index.html";
    },1500);

  }catch(error){

    showMessage(error.message,"error");

  }

}

// AUTO REDIRECT

onAuthStateChanged(auth,(user)=>{

  if(user && user.emailVerified){

    console.log("User already logged in");

  }

});

</script>

</body>
</html>
