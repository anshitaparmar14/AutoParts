<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Order History</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:
  linear-gradient(rgba(2,6,23,.95),rgba(15,23,42,.96)),
  url('./img/car.jpg') center/cover fixed;
  min-height:100vh;
  color:white;
  overflow-x:hidden;
}

/* SCROLLBAR */

::-webkit-scrollbar{
  width:8px;
}

::-webkit-scrollbar-thumb{
  background:#38bdf8;
  border-radius:20px;
}

/* BACKGROUND GLOW */

.bg-glow{
  position:fixed;
  width:500px;
  height:500px;
  border-radius:50%;
  background:rgba(56,189,248,.08);
  filter:blur(100px);
  z-index:-1;
}

.glow1{
  top:-200px;
  left:-150px;
}

.glow2{
  bottom:-250px;
  right:-150px;
}

/* CONTAINER */

.container{
  max-width:1250px;
  margin:auto;
  padding:35px 20px 60px;
}

/* HEADER */

.header{
  text-align:center;
  margin-bottom:35px;
}

.header h1{
  font-size:48px;
  color:#38bdf8;
  margin-bottom:10px;
  font-weight:700;
  letter-spacing:.5px;
  text-shadow:0 0 20px rgba(56,189,248,.25);
}

.header p{
  color:#cbd5e1;
  font-size:15px;
}

/* USER CARD */

.user-card{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(18px);
  border-radius:26px;
  padding:22px 25px;
  margin-bottom:35px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.user-email{
  font-size:16px;
  color:#cbd5e1;
}

.user-email strong{
  color:#38bdf8;
  font-size:17px;
}

.logout-btn{
  border:none;
  background:linear-gradient(135deg,#ef4444,#dc2626);
  color:white;
  padding:13px 24px;
  border-radius:14px;
  cursor:pointer;
  font-weight:600;
  transition:.3s;
  box-shadow:0 10px 25px rgba(239,68,68,.25);
}

.logout-btn:hover{
  transform:translateY(-3px);
}

/* ORDER CARD */

.order-card{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(18px);
  border-radius:28px;
  overflow:hidden;
  margin-bottom:35px;
  box-shadow:0 15px 35px rgba(0,0,0,.3);
  transition:.35s;
  animation:fadeUp .5s ease;
}

.order-card:hover{
  transform:translateY(-5px);
  box-shadow:0 25px 45px rgba(0,0,0,.35);
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(25px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* TOP */

.order-top{
  padding:24px;
  background:rgba(0,0,0,.2);
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:15px;
  border-bottom:1px solid rgba(255,255,255,.06);
}

.order-id{
  font-size:18px;
  font-weight:600;
}

.order-id strong{
  color:#38bdf8;
}

.order-date{
  color:#cbd5e1;
  font-size:14px;
}

/* CUSTOMER */

.customer-box{
  padding:24px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:16px;
}

.customer-item{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.05);
  padding:16px;
  border-radius:18px;
}

.customer-item span{
  display:block;
  color:#94a3b8;
  font-size:13px;
  margin-bottom:8px;
}

.customer-item strong{
  color:white;
  line-height:1.5;
  font-size:15px;
}

/* ITEMS */

.items{
  padding:0 24px 24px;
}

.items-title{
  font-size:20px;
  margin-bottom:18px;
  color:#38bdf8;
}

.item{
  display:flex;
  align-items:center;
  gap:18px;
  padding:16px;
  margin-bottom:15px;
  border-radius:20px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.05);
  transition:.3s;
}

.item:hover{
  background:rgba(255,255,255,.06);
}

.item img{
  width:95px;
  height:95px;
  object-fit:cover;
  border-radius:18px;
  background:white;
  padding:5px;
}

.item-details{
  flex:1;
}

.item-name{
  font-size:20px;
  font-weight:600;
  margin-bottom:10px;
}

.item-meta{
  color:#cbd5e1;
  font-size:14px;
  margin-bottom:6px;
}

/* BOTTOM */

.bottom{
  padding:24px;
  background:rgba(0,0,0,.16);
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:18px;
}

.total-box span{
  display:block;
  color:#94a3b8;
  font-size:14px;
  margin-bottom:5px;
}

.total{
  font-size:34px;
  color:#facc15;
  font-weight:700;
}

/* STATUS */

.status{
  padding:12px 22px;
  border-radius:999px;
  font-weight:700;
  font-size:14px;
  letter-spacing:.3px;
  border:1px solid transparent;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:90px 20px;
  border-radius:28px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(15px);
}

.empty-icon{
  font-size:80px;
  margin-bottom:15px;
}

.empty h2{
  color:#38bdf8;
  margin-bottom:10px;
  font-size:32px;
}

.empty p{
  color:#cbd5e1;
  font-size:15px;
}

/* MOBILE */

@media(max-width:768px){

  .header h1{
    font-size:34px;
  }

  .item{
    flex-direction:column;
    align-items:flex-start;
  }

  .item img{
    width:100%;
    height:220px;
  }

  .bottom{
    flex-direction:column;
    align-items:flex-start;
  }

  .total{
    font-size:28px;
  }

}

</style>
</head>

<body>

<div class="bg-glow glow1"></div>
<div class="bg-glow glow2"></div>

<div class="container">

  <div class="header">
    <h1>🚘 AutoParts Orders</h1>
    <p>Track your premium auto parts purchases in real-time</p>
  </div>

  <div class="user-card">

    <div class="user-email">
      Logged in as:
      <strong id="userEmail"></strong>
    </div>

    <button class="logout-btn" onclick="logout()">
      Logout
    </button>

  </div>

  <div id="orders-container"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* FIREBASE */

const firebaseConfig = {
  apiKey: "AIzaSyBBgKgDmd36zo0pRXRczMcBSzArK7OEJDo",
  authDomain: "autoparts-7f16a.firebaseapp.com",
  projectId: "autoparts-7f16a",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const container =
document.getElementById("orders-container");

const userEmailText =
document.getElementById("userEmail");

/* STORE LAST DATA */
/* THIS FIXES BLINKING */

let lastOrdersData = "";

/* LOGIN CHECK */

onAuthStateChanged(auth, (user) => {

  if(!user){

    alert("Please login first");

    window.location.href = "auth.html";

    return;

  }

  const currentUserEmail =
  user.email.trim().toLowerCase();

  userEmailText.innerText =
  currentUserEmail;

  loadOrders(currentUserEmail);

});

/* LIVE UPDATE */
/* NO MORE BLINKING */

setInterval(() => {

  const user = auth.currentUser;

  if(user){

    loadOrders(
      user.email.trim().toLowerCase()
    );

  }

}, 2000);

/* LOAD ORDERS */

function loadOrders(userEmail){

  let allOrders =
  JSON.parse(localStorage.getItem("orders")) || [];

  let userOrders = allOrders.filter(order => {

    if(!order.userEmail) return false;

    return order.userEmail
    .trim()
    .toLowerCase() === userEmail;

  });

  /* CHECK FOR CHANGES */
  /* PREVENT PAGE RE-RENDER */

  let currentData =
  JSON.stringify(userOrders);

  if(currentData === lastOrdersData){
    return;
  }

  lastOrdersData = currentData;

  /* EMPTY */

  if(userOrders.length === 0){

    container.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          📭
        </div>

        <h2>No Orders Yet</h2>

        <p>
          Your purchased auto parts will appear here.
        </p>

      </div>

    `;

    return;
  }

  /* LATEST FIRST */

  userOrders.reverse();

  let html = "";

  userOrders.forEach(order => {

    let updatedStatus =
    localStorage.getItem(
      "status_" + order.id
    );

    if(updatedStatus){
      order.status = updatedStatus;
    }

    let itemsHTML = order.items.map(item => `

      <div class="item">

        <img src="${item.image}" alt="product">

        <div class="item-details">

          <div class="item-name">
            ${item.name}
          </div>

          <div class="item-meta">
            Quantity: ${item.quantity || 1}
          </div>

          <div class="item-meta">
            Premium Auto Part
          </div>

        </div>

      </div>

    `).join("");

    /* STATUS COLORS */

    let statusColor = "#4ade80";
    let statusBg = "rgba(34,197,94,.15)";
    let statusBorder = "rgba(34,197,94,.3)";

    if(order.status === "Packed"){

      statusColor = "#facc15";
      statusBg = "rgba(250,204,21,.15)";
      statusBorder = "rgba(250,204,21,.3)";

    }

    if(order.status === "Out For Delivery"){

      statusColor = "#38bdf8";
      statusBg = "rgba(56,189,248,.15)";
      statusBorder = "rgba(56,189,248,.3)";

    }

    if(order.status === "Delivered"){

      statusColor = "#22c55e";
      statusBg = "rgba(34,197,94,.15)";
      statusBorder = "rgba(34,197,94,.3)";

    }

    if(order.status === "Cancelled"){

      statusColor = "#ef4444";
      statusBg = "rgba(239,68,68,.15)";
      statusBorder = "rgba(239,68,68,.3)";

    }

    html += `

      <div class="order-card">

        <div class="order-top">

          <div class="order-id">
            Order ID:
            <strong>${order.id}</strong>
          </div>

          <div class="order-date">
            ${order.date}
          </div>

        </div>

        <div class="customer-box">

          <div class="customer-item">
            <span>👤 Customer Name</span>
            <strong>
              ${order.customerName || "Not Available"}
            </strong>
          </div>

          <div class="customer-item">
            <span>📧 Email Address</span>
            <strong>
              ${order.userEmail || "Not Available"}
            </strong>
          </div>

          <div class="customer-item">
            <span>📱 Phone Number</span>
            <strong>
              ${order.phone || "Not Available"}
            </strong>
          </div>

          <div class="customer-item">
            <span>🏠 Delivery Address</span>
            <strong>
              ${order.address || "Not Available"}
            </strong>
          </div>

        </div>

        <div class="items">

          <div class="items-title">
            Ordered Products
          </div>

          ${itemsHTML}

        </div>

        <div class="bottom">

          <div class="total-box">

            <span>Total Amount</span>

            <div class="total">
              ₹${order.total}
            </div>

          </div>

          <div class="status"
          style="
          color:${statusColor};
          background:${statusBg};
          border-color:${statusBorder};
          ">

            ${order.status || "Order Confirmed"}

          </div>

        </div>

      </div>

    `;

  });

  container.innerHTML = html;

}

/* LOGOUT */

window.logout = async function(){

  await signOut(auth);

  window.location.href = "auth.html";

};

</script>

</body>
</html>
