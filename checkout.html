<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - AutoParts Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:
  linear-gradient(rgba(2,6,23,.95),rgba(15,23,42,.95)),
  url('./img/car.jpg') center/cover no-repeat fixed;
  color:white;
  min-height:100vh;
}

.header{
  text-align:center;
  padding:30px 20px 10px;
}

.header h1{
  font-size:42px;
  color:#38bdf8;
  margin-bottom:10px;
}

.header p{
  color:#cbd5e1;
}

.wrapper{
  max-width:1200px;
  margin:auto;
  padding:20px;
  display:flex;
  gap:25px;
  flex-wrap:wrap;
}

.card{
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:24px;
  padding:25px;
  backdrop-filter:blur(15px);
  box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.form{
  flex:2;
  min-width:320px;
}

.summary{
  flex:1;
  min-width:320px;
  height:fit-content;
}

.card h3{
  margin-bottom:20px;
  color:#38bdf8;
  font-size:24px;
}

.input-group{
  margin-bottom:16px;
}

.input-group label{
  display:block;
  margin-bottom:8px;
  font-size:14px;
  color:#e2e8f0;
}

.input-box{
  position:relative;
}

.input-box span{
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  color:#94a3b8;
  font-size:15px;
}

.input-box input{
  width:100%;
  padding:14px 14px 14px 45px;
  border:none;
  outline:none;
  border-radius:14px;
  background:rgba(255,255,255,0.08);
  color:white;
  font-size:15px;
  border:1px solid rgba(255,255,255,0.08);
}

.input-box input::placeholder{
  color:#94a3b8;
}

.row{
  display:flex;
  gap:15px;
}

.row .input-group{
  flex:1;
}

.item{
  display:flex;
  justify-content:space-between;
  margin-bottom:14px;
  font-size:15px;
}

.total{
  margin-top:20px;
  padding-top:20px;
  border-top:1px solid rgba(255,255,255,0.1);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.total h2{
  color:#facc15;
}

.payment-box{
  margin-top:25px;
}

.payment-box h4{
  margin-bottom:15px;
}

.pay-option{
  display:flex;
  gap:15px;
}

.pay-option div{
  flex:1;
  padding:14px;
  border-radius:14px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.08);
  text-align:center;
  cursor:pointer;
  transition:.3s;
  font-weight:600;
}

.pay-option div:hover{
  transform:translateY(-2px);
}

.active{
  background:#22c55e !important;
  color:black;
}

button{
  width:100%;
  margin-top:25px;
  border:none;
  padding:16px;
  border-radius:16px;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:black;
  font-weight:700;
  font-size:16px;
  cursor:pointer;
  transition:.3s;
}

button:hover{
  transform:scale(1.02);
}

.note{
  margin-top:15px;
  text-align:center;
  color:#94a3b8;
  font-size:13px;
}

@media(max-width:768px){

  .header h1{
    font-size:32px;
  }

  .row{
    flex-direction:column;
  }

}

</style>
</head>

<body>

<div class="header">
  <h1>💳 Smart Checkout</h1>
  <p>Secure AutoParts payment system</p>
</div>

<div class="wrapper">

  <!-- FORM -->

  <div class="card form">

    <h3>Delivery Details</h3>

    <div class="input-group">
      <label>Full Name</label>

      <div class="input-box">
        <span>👤</span>
        <input type="text" id="name" placeholder="Enter full name">
      </div>
    </div>

    <div class="input-group">
      <label>Email</label>

      <div class="input-box">
        <span>📧</span>
        <input type="email" id="email" placeholder="Enter email">
      </div>
    </div>

    <div class="input-group">
      <label>Phone Number</label>

      <div class="input-box">
        <span>+91</span>

        <input
        type="tel"
        id="phone"
        placeholder="9876543210"
        maxlength="10"
        inputmode="numeric">
      </div>
    </div>

    <div class="input-group">
      <label>Address</label>

      <div class="input-box">
        <span>🏠</span>
        <input type="text" id="address" placeholder="Enter address">
      </div>
    </div>

    <div class="row">

      <div class="input-group">
        <label>City</label>

        <div class="input-box">
          <span>🏙️</span>
          <input type="text" id="city" placeholder="City">
        </div>
      </div>

      <div class="input-group">
        <label>State</label>

        <div class="input-box">
          <span>📍</span>
          <input type="text" id="state" placeholder="State">
        </div>
      </div>

    </div>

    <div class="row">

      <div class="input-group">
        <label>Pincode</label>

        <div class="input-box">
          <span>📮</span>

          <input
          type="tel"
          id="pincode"
          placeholder="400001"
          maxlength="6"
          inputmode="numeric">
        </div>
      </div>

      <div class="input-group">
        <label>Country</label>

        <div class="input-box">
          <span>🇮🇳</span>
          <input type="text" value="India" readonly>
        </div>
      </div>

    </div>

  </div>

  <!-- SUMMARY -->

  <div class="card summary">

    <h3>Order Summary</h3>

    <div class="item">
      <span>Subtotal</span>
      <span id="sub"></span>
    </div>

    <div class="item">
      <span>GST (18%)</span>
      <span id="gst"></span>
    </div>

    <div class="total">
      <span>Total</span>
      <h2 id="final"></h2>
    </div>

    <div class="payment-box">

      <h4>Payment Method</h4>

      <div class="pay-option">

        <div
        id="online"
        class="active"
        onclick="selectPay('online')">

          💳 Online

        </div>

        <div
        id="cod"
        onclick="selectPay('cod')">

          📦 COD

        </div>

      </div>

    </div>

    <button onclick="placeOrder()">
      Place Order
    </button>

    <div class="note">
      Secure checkout • Razorpay protected
    </div>

  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE */

const firebaseConfig = {
  apiKey: "AIzaSyBBgKgDmd36zo0pRXRczMcBSzArK7OEJDo",
  authDomain: "autoparts-7f16a.firebaseapp.com",
  projectId: "autoparts-7f16a",
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

/* USER */

let loggedInUser = null;

onAuthStateChanged(auth, (user) => {

  if(user){

    loggedInUser = user;

    document.getElementById("email").value =
    user.email || "";

  }

});

/* CART */

let cart =
JSON.parse(localStorage.getItem("cart")) || [];

let subtotal = 0;

cart.forEach(item => {
  subtotal += item.price * item.quantity;
});

let gst = subtotal * 0.18;

let total = subtotal + gst;

document.getElementById("sub").innerText =
"₹" + subtotal.toFixed(2);

document.getElementById("gst").innerText =
"₹" + gst.toFixed(2);

document.getElementById("final").innerText =
"₹" + total.toFixed(2);

let paymentMethod = "online";

/* PAYMENT */

window.selectPay = function(type){

  paymentMethod = type;

  document.getElementById("online")
  .classList.remove("active");

  document.getElementById("cod")
  .classList.remove("active");

  document.getElementById(type)
  .classList.add("active");

}

/* VALIDATION */

function validateFields(){

  let fields = [
    "name",
    "email",
    "phone",
    "address",
    "city",
    "state",
    "pincode"
  ];

  for(let field of fields){

    if(!document.getElementById(field).value.trim()){

      alert("Please fill all details");
      return false;

    }

  }

  let phone =
  document.getElementById("phone").value.trim();

  if(!/^[0-9]{10}$/.test(phone)){

    alert("Phone number must be exactly 10 digits");
    return false;

  }

  let pincode =
  document.getElementById("pincode").value.trim();

  if(!/^[0-9]{6}$/.test(pincode)){

    alert("Pincode must be exactly 6 digits");
    return false;

  }

  return true;

}

/* SAVE ORDER */

async function saveOrder(status){

  let orders =
  JSON.parse(localStorage.getItem("orders")) || [];

  const newOrder = {

    id: "ORD-" + Date.now(),

    userEmail:
    document.getElementById("email")
    .value.trim().toLowerCase(),

    customerName:
    document.getElementById("name").value,

    phone:
    "+91 " +
    document.getElementById("phone").value,

    address:
    document.getElementById("address").value +
    ", " +
    document.getElementById("city").value +
    ", " +
    document.getElementById("state").value +
    " - " +
    document.getElementById("pincode").value,

    date:
    new Date().toLocaleString(),

    items: cart,

    total:
    total.toFixed(2),

    status: status

  };

  /* SAVE LOCAL */

  orders.push(newOrder);

  localStorage.setItem(
    "orders",
    JSON.stringify(orders)
  );

  /* SAVE FIREBASE */

  try{

    await addDoc(collection(db, "orders"), newOrder);

    console.log("Order saved to Firebase");

  }catch(error){

    console.log("Firebase Error:", error);

  }

  localStorage.removeItem("cart");

}

/* PLACE ORDER */

window.placeOrder = async function(){

  if(!validateFields()) return;

  localStorage.setItem("finalOrder", JSON.stringify({

    name:
    document.getElementById("name").value,

    email:
    document.getElementById("email").value,

    phone:
    "+91 " +
    document.getElementById("phone").value,

    address:
    document.getElementById("address").value,

    city:
    document.getElementById("city").value,

    state:
    document.getElementById("state").value,

    pincode:
    document.getElementById("pincode").value,

    cart: cart,

    total:
    total.toFixed(2)

  }));

  /* COD */

  if(paymentMethod === "cod"){

    await saveOrder("Order Placed");

    alert("✅ Order placed successfully");

    window.location.href = "invoice.html";

    return;

  }

  /* ONLINE */

  fetch("http://localhost:5000/create-order",{

    method:"POST",

    headers:{
      "Content-Type":"application/json"
    },

    body: JSON.stringify({
      amount: total
    })

  })

  .then(res => res.json())

  .then(order => {

    const options = {

      key:"rzp_test_SlXkETnXVDOsYQ",

      amount:order.amount,

      currency:"INR",

      name:"AutoParts Hub",

      description:"Order Payment",

      order_id:order.id,

      handler: async function(){

        await saveOrder("Paid");

        alert("🎉 Payment Successful!");

        window.location.href="invoice.html";

      }

    };

    new Razorpay(options).open();

  })

  .catch(() => {

    alert("Payment failed");

  });

}

/* NUMBER ONLY */

document.getElementById("phone")
.addEventListener("input", function(){

  this.value =
  this.value.replace(/\D/g,'');

});

document.getElementById("pincode")
.addEventListener("input", function(){

  this.value =
  this.value.replace(/\D/g,'');

});

</script>

</body>
</html>
